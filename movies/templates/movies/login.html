{% extends 'movies/base.html' %}

{% block title %}Login - The Cinematic{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-16">
    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold mb-2 gradient-text">Welcome Back</h1>
            <p class="text-slate-400">Sign in to continue your cinematic journey</p>
        </div>

        <form method="post" class="bg-slate-900 rounded-xl p-8 border border-slate-800">
            {% csrf_token %}
            
            <div class="mb-6">
                <label class="block text-sm font-semibold mb-2">Username</label>
                <input
                    type="text"
                    name="username"
                    class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-amber-500 transition-colors"
                    placeholder="Your username"
                    required
                >
            </div>

            <div class="mb-6">
                <label class="block text-sm font-semibold mb-2">Password</label>
                <input
                    type="password"
                    name="password"
                    class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-amber-500 transition-colors"
                    placeholder="••••••••"
                    required
                >
            </div>

            <button type="submit" class="w-full px-6 py-3 bg-amber-500 hover:bg-amber-600 text-black font-semibold rounded-lg transition-colors mb-4">
                Sign In
            </button>

            <div class="text-center text-slate-400 text-sm">
                Don't have an account?
                <a href="{% url 'signup' %}" class="text-amber-400 hover:text-amber-300 font-semibold">Sign Up</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
